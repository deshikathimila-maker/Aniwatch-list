<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AniWatch List</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#060b16;
  color:#f5f7ff;
  min-height:100vh;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(6,11,22,.88);
  backdrop-filter:blur(18px);
  border-bottom:1px solid #17233a;
}

.nav{
  max-width:1150px;
  margin:auto;
  padding:15px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  font-size:23px;
  font-weight:800;
  letter-spacing:.4px;
  animation:brandIn .8s ease;
}

@keyframes brandIn{
  from{
    opacity:0;
    transform:translateY(-12px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* PROFILE */

.profile-wrap{
  position:relative;
}

.profile-btn{
  border:1px solid #263b61;
  background:#0d1729;
  color:#fff;
  padding:8px 13px;
  border-radius:10px;
  transition:.2s;
  font-size:13px;
}

.profile-btn:hover{
  background:#12213a;
  border-color:#3b5f96;
}

.profile-menu{
  display:none;
  position:absolute;
  right:0;
  top:45px;
  width:235px;
  background:#0d1525;
  border:1px solid #263b61;
  border-radius:13px;
  padding:14px;
  box-shadow:0 20px 50px rgba(0,0,0,.55);
}

.profile-menu.show{
  display:block;
  animation:menuIn .18s ease;
}

.profile-email{
  font-size:13px;
  color:#8e9bb2;
  word-break:break-all;
  margin-bottom:12px;
}

.logout{
  width:100%;
  border:1px solid #263b61;
  background:#111e34;
  color:#fff;
  padding:10px;
  border-radius:9px;
}

/* MAIN */

.container{
  max-width:1150px;
  margin:auto;
  padding:25px 20px 55px;
}

.hero{
  padding:12px 0 5px;
}

.hero h1{
  font-size:29px;
  margin-bottom:3px;
  animation:heroTitle .7s ease;
}

@keyframes heroTitle{
  from{
    opacity:0;
    transform:translateX(-18px);
  }
  to{
    opacity:1;
    transform:translateX(0);
  }
}

/* MOVING ANIME STRIP */

.anime-slider{
  width:100%;
  overflow:hidden;
  margin:14px 0 13px;
  padding:4px 0 7px;

  -webkit-mask-image:linear-gradient(
    to right,
    transparent,
    black 5%,
    black 95%,
    transparent
  );

  mask-image:linear-gradient(
    to right,
    transparent,
    black 5%,
    black 95%,
    transparent
  );
}

.anime-track{
  display:flex;
  width:max-content;
  gap:12px;
  animation:animeMove 30s linear infinite;
}

.anime-track:hover{
  animation-play-state:paused;
}

.slider-card{
  width:105px;
  height:140px;
  flex-shrink:0;
  position:relative;
  overflow:hidden;
  border-radius:11px;
  border:1px solid #203b62;
  background:#0b1628;
  cursor:pointer;
  transition:.25s;
  box-shadow:0 7px 20px rgba(0,0,0,.2);
}

.slider-card:hover{
  transform:translateY(-4px) scale(1.03);
  border-color:#4385d4;
}

.slider-card img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.slider-card::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    to top,
    rgba(4,9,18,.94),
    rgba(4,9,18,.05) 65%
  );
}

.slider-title{
  position:absolute;
  z-index:2;
  bottom:8px;
  left:8px;
  right:8px;
  font-size:11px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.no-slider{
  width:100%;
  height:70px;
  border:1px dashed #203657;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#596982;
  font-size:12px;
}

@keyframes animeMove{
  from{
    transform:translateX(0);
  }
  to{
    transform:translateX(-50%);
  }
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:6px;
}

.stat{
  background:rgba(12,22,40,.72);
  border:1px solid #172a49;
  border-radius:10px;
  padding:8px 10px;
  min-height:62px;
  backdrop-filter:blur(12px);
}

.stat-number{
  font-size:19px;
  font-weight:700;
}

.stat-label{
  color:#71809a;
  font-size:10px;
  margin-top:3px;
}

.watching-stat{
  border-color:#214a7b;
}

.completed-stat{
  border-color:#245c46;
}

.plan-stat{
  border-color:#66531d;
}

.total-stat{
  border-color:#303e55;
}

/* TOOLBAR */

.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin:24px 0 17px;
}

.toolbar h2{
  font-size:21px;
}

.toolbar-right{
  display:flex;
  gap:9px;
  align-items:center;
}

.search{
  width:230px;
  background:#0c1628;
  color:#fff;
  border:1px solid #203657;
  border-radius:10px;
  padding:10px 12px;
  outline:none;
}

.search:focus{
  border-color:#3977c4;
  box-shadow:0 0 0 2px rgba(57,119,196,.12);
}

.primary{
  border:1px solid #4b82d1;
  background:#1b5fb7;
  color:#fff;
  border-radius:10px;
  padding:10px 15px;
  font-weight:bold;
  transition:.2s;
}

.primary:hover{
  background:#2670d0;
  transform:translateY(-1px);
}

.secondary{
  border:1px solid #263b61;
  background:#101d31;
  color:#fff;
  border-radius:10px;
  padding:10px 14px;
}

/* ANIME CARDS */

.anime-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:17px;
}

.card{
  position:relative;
  background:#0b1628;
  border:1px solid #1c3a67;
  border-radius:14px;
  overflow:hidden;
  transition:.28s ease;
  animation:cardIn .45s ease both;
  box-shadow:0 8px 25px rgba(0,0,0,.18);
  cursor:pointer;
}

.card:hover{
  transform:translateY(-6px);
  border-color:#3977c4;
  box-shadow:0 16px 38px rgba(16,87,170,.25);
}

@keyframes cardIn{
  from{
    opacity:0;
    transform:translateY(12px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* BLURRED POSTER BACKGROUND */

.card-bg{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  filter:blur(22px);
  transform:scale(1.18);
  opacity:.42;
}

.card-overlay{
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      180deg,
      rgba(4,10,20,.18),
      rgba(4,10,20,.92)
    );
}

.card-content{
  position:relative;
  z-index:2;
}

.card-poster{
  height:270px;
  margin:10px 10px 0;
  border-radius:10px;
  overflow:hidden;
  background:#101c30;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#66758d;
  position:relative;
}

.card-poster img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:transform .35s ease;
}

.card:hover .card-poster img{
  transform:scale(1.04);
}

.card-info{
  padding:13px;
}

.card-title{
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.card-meta{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:5px;
  margin-top:8px;
  color:#8290a8;
  font-size:12px;
}

/* GLASS RATING */

.rating-box{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:43px;
  height:25px;
  padding:0 7px;
  border-radius:7px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.16);
  backdrop-filter:blur(9px);
  color:#fff;
  font-size:11px;
  font-weight:bold;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.08),
    0 4px 12px rgba(0,0,0,.2);
}

/* STATUS */

.status{
  display:inline-block;
  margin-top:9px;
  background:#102a4d;
  color:#8bbcff;
  border:1px solid #214a7b;
  border-radius:6px;
  padding:5px 8px;
  font-size:11px;
}

.status-completed{
  background:#103322;
  color:#75dca7;
  border-color:#245c46;
}

.status-plan{
  background:#352b0b;
  color:#e7c86b;
  border-color:#66531d;
}

.status-onhold{
  background:#39230e;
  color:#e8a15c;
  border-color:#70451e;
}

.status-dropped{
  background:#3b1218;
  color:#e57e8b;
  border-color:#712934;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:55px 20px;
  background:#0c1628;
  border:1px solid #172a49;
  border-radius:15px;
  color:#77859d;
}

/* MODALS */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:50;
  background:rgba(0,0,0,.78);
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:450px;
  max-height:90vh;
  overflow:auto;
  background:#0d1728;
  border:1px solid #263b61;
  border-radius:17px;
  padding:22px;
  animation:modalIn .2s ease;
}

.modal-box h2{
  margin-bottom:16px;
}

input,select,textarea{
  width:100%;
  background:#07101e;
  color:#fff;
  border:1px solid #263b61;
  border-radius:9px;
  padding:11px;
  margin-bottom:11px;
  outline:none;
}

input:focus,select:focus,textarea:focus{
  border-color:#3977c4;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.modal-actions{
  display:flex;
  gap:9px;
}

.modal-actions button{
  flex:1;
}

@keyframes modalIn{
  from{
    opacity:0;
    transform:scale(.96);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

/* DETAILS */

.details-box{
  max-width:650px;
}

.details-layout{
  position:relative;
  display:grid;
  grid-template-columns:190px 1fr;
  gap:20px;
  overflow:hidden;
  border-radius:14px;
  padding:3px;
  background:#0b1628;
}

.details-layout::before{
  content:"";
  position:absolute;
  inset:-30px;
  background-size:cover;
  background-position:center;
  filter:blur(28px);
  opacity:.25;
  z-index:0;
}

.details-layout > *{
  position:relative;
  z-index:2;
}

.details-poster{
  height:280px;
  background:#101c30;
  border-radius:12px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#66758d;
}

.details-poster img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.details-content h2{
  font-size:27px;
  margin-bottom:10px;
}

.detail-line{
  color:#a0adbf;
  margin:9px 0;
}

.notes{
  margin-top:15px;
  background:#07101e;
  padding:12px;
  border-radius:10px;
  color:#9aa7ba;
  line-height:1.5;
}

.details-actions{
  display:flex;
  gap:9px;
  margin-top:18px;
}

.details-actions button{
  flex:1;
}

/* MOBILE */

@media(max-width:900px){

  .anime-grid{
    grid-template-columns:repeat(4,1fr);
  }

}

@media(max-width:700px){

  .anime-grid{
    grid-template-columns:repeat(3,1fr);
  }

  .toolbar{
    flex-direction:column;
    align-items:stretch;
  }

  .toolbar-right{
    width:100%;
  }

  .search{
    width:100%;
  }

}

@media(max-width:500px){

  .container{
    padding:20px 13px 45px;
  }

  .brand{
    font-size:20px;
  }

  .profile-btn{
    padding:7px 10px;
    font-size:12px;
  }

  .hero h1{
    font-size:25px;
  }

  .stats{
    gap:6px;
  }

  .stat{
    padding:8px;
    min-height:58px;
  }

  .stat-number{
    font-size:17px;
  }

  .stat-label{
    font-size:9px;
  }

  .anime-grid{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .card-poster{
    height:230px;
  }

  .slider-card{
    width:88px;
    height:125px;
  }

  .details-layout{
    grid-template-columns:1fr;
  }

  .details-poster{
    height:330px;
  }

  .details-actions{
    flex-direction:column;
  }

}
</style>
</head>

<body>

<header class="header">

<nav class="nav">

<div class="brand">
  AniWatch List
</div>

<div class="profile-wrap">

<button
  class="profile-btn"
  onclick="toggleProfile()">
  Profile
</button>

<div
  class="profile-menu"
  id="profileMenu">

  <div
    class="profile-email"
    id="profileEmail">
    Not logged in
  </div>

  <button
    class="logout"
    onclick="logout()">
    Logout
  </button>

</div>

</div>

</nav>

</header>


<main class="container">

<section class="hero">

<h1>AniWatch List</h1>

<!-- AUTO MOVING ANIME POSTERS -->

<div class="anime-slider">

  <div
    class="anime-track"
    id="animeTrack">
  </div>

</div>


<!-- SMALL STATUS COUNTERS -->

<div class="stats">

<div class="stat watching-stat">
  <div
    class="stat-number"
    id="watchingCount">
    0
  </div>

  <div class="stat-label">
    Watching
  </div>
</div>


<div class="stat completed-stat">
  <div
    class="stat-number"
    id="completedCount">
    0
  </div>

  <div class="stat-label">
    Completed
  </div>
</div>


<div class="stat plan-stat">
  <div
    class="stat-number"
    id="planCount">
    0
  </div>

  <div class="stat-label">
    Plan to Watch
  </div>
</div>


<div class="stat total-stat">
  <div
    class="stat-number"
    id="totalCount">
    0
  </div>

  <div class="stat-label">
    Total
  </div>
</div>

</div>

</section>


<!-- TOOLBAR -->

<div class="toolbar">

<h2>Anime</h2>

<div class="toolbar-right">

<input
  class="search"
  id="search"
  autocomplete="off"
  placeholder="Search anime..."
  oninput="renderAnime()">

<button
  class="primary"
  onclick="openAnimeModal()">
  Add Anime
</button>

</div>

</div>


<!-- ANIME GRID -->

<div
  class="anime-grid"
  id="animeGrid">

<div class="empty">
Login to see your anime collection.
</div>

</div>

</main>


<!-- ADD / EDIT MODAL -->

<div
  class="modal"
  id="animeModal">

<div class="modal-box">

<h2 id="animeModalTitle">
Add Anime
</h2>

<input
  id="animeTitle"
  autocomplete="off"
  placeholder="Anime title">

<select id="animeStatus">

<option value="Watching">
Watching
</option>

<option value="Completed">
Completed
</option>

<option value="Plan to Watch">
Plan to Watch
</option>

<option value="On Hold">
On Hold
</option>

<option value="Dropped">
Dropped
</option>

</select>

<input
  id="animeEpisodes"
  type="number"
  placeholder="Episodes">

<input
  id="animeRating"
  type="number"
  min="0"
  max="10"
  step="0.1"
  placeholder="Rating / 10">

<input
  id="animePoster"
  autocomplete="off"
  placeholder="Poster image URL">

<textarea
  id="animeNotes"
  placeholder="Notes about this anime...">
</textarea>

<div class="modal-actions">

<button
  class="primary"
  onclick="saveAnime()">
  Save
</button>

<button
  class="secondary"
  onclick="closeAnimeModal()">
  Cancel
</button>

</div>

</div>

</div>


<!-- DETAILS MODAL -->

<div
  class="modal"
  id="detailsModal">

<div class="modal-box details-box">

<div
  class="details-layout"
  id="detailsLayout">

<div
  class="details-poster"
  id="detailsPoster">
  No Poster
</div>

<div class="details-content">

<h2 id="detailsTitle">
Anime
</h2>

<div
  class="detail-line"
  id="detailsStatus">
  Status:
</div>

<div
  class="detail-line"
  id="detailsEpisodes">
  Episodes:
</div>

<div
  class="detail-line"
  id="detailsRating">
  Rating:
</div>

<div
  class="notes"
  id="detailsNotes">
  No notes.
</div>

</div>

</div>

<div class="details-actions">

<button
  class="primary"
  onclick="editCurrentAnime()">
  Edit
</button>

<button
  class="secondary"
  onclick="deleteCurrentAnime()">
  Delete
</button>

<button
  class="secondary"
  onclick="closeDetails()">
  Close
</button>

</div>

</div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://iwggkwxirqydixsbbctb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_1McSJW8L9GflzowekoZM6A_mT53BuX7";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let animeList = [];
let editingId = null;
let currentAnime = null;


/* =========================
   PROFILE
========================= */

function toggleProfile(){

  document
    .getElementById("profileMenu")
    .classList.toggle("show");

}


/* =========================
   LOGOUT
========================= */

async function logout(){

  const {
    error
  } =
  await supabaseClient.auth.signOut();

  if(error){

    alert(error.message);
    return;

  }

  document
    .getElementById("profileMenu")
    .classList.remove("show");

  animeList = [];

  updateUI(null);
  renderAnime();

}


/* =========================
   CHECK USER
========================= */

async function checkUser(){

  const {
    data:{session}
  } =
  await supabaseClient.auth.getSession();

  updateUI(session);

  if(session){

    await loadAnime();

  }else{

    animeList = [];
    renderAnime();

  }

}


/* =========================
   UPDATE UI
========================= */

function updateUI(session){

  document
    .getElementById("profileEmail")
    .textContent =
    session
      ? session.user.email
      : "Not logged in";

}


/* =========================
   LOAD ANIME
========================= */

async function loadAnime(){

  const {
    data:{user}
  } =
  await supabaseClient.auth.getUser();

  if(!user){

    animeList = [];
    renderAnime();
    return;

  }


  const {
    data,
    error
  } =
  await supabaseClient
    .from("anime")
    .select("*")
    .eq("user_id",user.id)
    .order("id",{ascending:false});


  if(error){

    alert(error.message);
    return;

  }


  animeList = data || [];

  renderAnime();

}


/* =========================
   OPEN ADD / EDIT
========================= */

function openAnimeModal(anime=null){

  editingId =
    anime
      ? anime.id
      : null;


  document
    .getElementById("animeModalTitle")
    .textContent =
    anime
      ? "Edit Anime"
      : "Add Anime";


  document
    .getElementById("animeTitle")
    .value =
    anime?.title || "";


  document
    .getElementById("animeStatus")
    .value =
    anime?.status || "Watching";


  document
    .getElementById("animeEpisodes")
    .value =
    anime?.episodes ?? "";


  document
    .getElementById("animeRating")
    .value =
    anime?.rating ?? "";


  document
    .getElementById("animePoster")
    .value =
    anime?.poster || "";


  document
    .getElementById("animeNotes")
    .value =
    anime?.notes || "";


  document
    .getElementById("animeModal")
    .classList.add("show");

}


/* =========================
   CLOSE ADD / EDIT
========================= */

function closeAnimeModal(){

  document
    .getElementById("animeModal")
    .classList.remove("show");

  editingId = null;

}


/* =========================
   SAVE
========================= */

async function saveAnime(){

  const {
    data:{user}
  } =
  await supabaseClient.auth.getUser();


  if(!user){

    alert("Please login first.");
    return;

  }


  const title =
    document
      .getElementById("animeTitle")
      .value
      .trim();


  if(!title){

    alert("Please enter an anime title.");
    return;

  }


  const animeData = {

    title:title,

    status:
      document
        .getElementById("animeStatus")
        .value,

    episodes:
      document
        .getElementById("animeEpisodes")
        .value === ""
        ? null
        : Number(
            document
              .getElementById("animeEpisodes")
              .value
          ),

    rating:
      document
        .getElementById("animeRating")
        .value === ""
        ? null
        : Number(
            document
              .getElementById("animeRating")
              .value
          ),

    poster:
      document
        .getElementById("animePoster")
        .value
        .trim() || null,

    notes:
      document
        .getElementById("animeNotes")
        .value
        .trim() || null

  };


  let result;


  /* EDIT = UPDATE EXISTING ROW */

  if(editingId !== null){

    result =
      await supabaseClient
        .from("anime")
        .update(animeData)
        .eq("id",editingId)
        .eq("user_id",user.id);

  }


  /* NEW = INSERT */

  else{

    result =
      await supabaseClient
        .from("anime")
        .insert({
          ...animeData,
          user_id:user.id
        });

  }


  if(result.error){

    alert(result.error.message);
    return;

  }


  closeAnimeModal();

  await loadAnime();

}


/* =========================
   RENDER ANIME
========================= */

function renderAnime(){

  const grid =
    document.getElementById("animeGrid");


  const searchInput =
    document.getElementById("search");


  const search =
    searchInput
      ? searchInput.value.toLowerCase()
      : "";


  const filtered =
    animeList.filter(anime =>
      (anime.title || "")
        .toLowerCase()
        .includes(search)
    );


  if(!filtered.length){

    grid.innerHTML = `
      <div class="empty">
        ${
          animeList.length
            ? "No anime matches your search."
            : "No anime in your collection yet."
        }
      </div>
    `;

    updateStats();
    renderAnimeSlider();

    return;

  }


  grid.innerHTML =
    filtered.map((anime,index)=>{


      const poster =
        anime.poster
          ? `
            <img
              src="${escapeHtml(anime.poster)}"
              alt="${escapeHtml(anime.title)}"
              onerror="this.style.display='none'">
          `
          : "No Poster";


      const background =
        anime.poster
          ? `
            style="
              background-image:
              url('${escapeHtml(anime.poster)}')
            "
          `
          : "";


      const statusClass =
        getStatusClass(anime.status);


      return `

        <div
          class="card"
          style="animation-delay:${index * .04}s"
          onclick="openDetails(${anime.id})">

          <div
            class="card-bg"
            ${background}>
          </div>

          <div class="card-overlay"></div>

          <div class="card-content">

            <div class="card-poster">
              ${poster}
            </div>

            <div class="card-info">

              <div class="card-title">
                ${escapeHtml(anime.title)}
              </div>

              <div class="card-meta">

                <span class="rating-box">
                  ★ ${anime.rating ?? "-"}
                </span>

                <span>
                  ${anime.episodes ?? "-"} eps
                </span>

              </div>

              <div class="status ${statusClass}">
                ${escapeHtml(anime.status || "")}
              </div>

            </div>

          </div>

        </div>

      `;

    }).join("");


  updateStats();
  renderAnimeSlider();

}


/* =========================
   STATUS COLOR
========================= */

function getStatusClass(status){

  if(status === "Completed"){
    return "status-completed";
  }

  if(status === "Plan to Watch"){
    return "status-plan";
  }

  if(status === "On Hold"){
    return "status-onhold";
  }

  if(status === "Dropped"){
    return "status-dropped";
  }

  return "";

}


/* =========================
   MOVING ANIME SLIDER
========================= */

function renderAnimeSlider(){

  const track =
    document.getElementById("animeTrack");


  if(!track){
    return;
  }


  const items =
    animeList
      .filter(anime => anime.poster)
      .slice(0,6);


  if(!items.length){

    track.innerHTML = `
      <div class="no-slider">
        Add anime with posters to see them here.
      </div>
    `;

    track.style.animation = "none";

    return;

  }


  const cards =
    items.map(anime => `

      <div
        class="slider-card"
        onclick="openDetails(${anime.id})">

        <img
          src="${escapeHtml(anime.poster)}"
          alt="${escapeHtml(anime.title)}"
          onerror="this.style.display='none'">

        <div class="slider-title">
          ${escapeHtml(anime.title)}
        </div>

      </div>

    `).join("");


  /*
    Duplicate the same cards so the
    animation can move continuously.
  */

  track.innerHTML =
    cards + cards;


  track.style.animation =
    items.length > 1
      ? "animeMove 30s linear infinite"
      : "none";

}


/* =========================
   DETAILS
========================= */

function openDetails(id){

  currentAnime =
    animeList.find(
      anime => anime.id === id
    );


  if(!currentAnime){
    return;
  }


  document
    .getElementById("detailsTitle")
    .textContent =
    currentAnime.title;


  document
    .getElementById("detailsStatus")
    .textContent =
    "Status: " +
    (currentAnime.status || "-");


  document
    .getElementById("detailsEpisodes")
    .textContent =
    "Episodes: " +
    (currentAnime.episodes ?? "-");


  document
    .getElementById("detailsRating")
    .textContent =
    "Rating: " +
    (currentAnime.rating ?? "-");


  document
    .getElementById("detailsNotes")
    .textContent =
    currentAnime.notes ||
    "No notes.";


  const poster =
    document
      .getElementById("detailsPoster");


  if(currentAnime.poster){

    poster.innerHTML = `
      <img
        src="${escapeHtml(currentAnime.poster)}"
        alt=""
        onerror="this.style.display='none'">
    `;

  }else{

    poster.textContent = "No Poster";

  }


  const detailsLayout =
    document
      .getElementById("detailsLayout");


  if(currentAnime.poster){

    detailsLayout.style.backgroundImage =
      `linear-gradient(
        rgba(6,11,22,.82),
        rgba(6,11,22,.92)
      ), url("${escapeHtml(currentAnime.poster)}")`;

    detailsLayout.style.backgroundSize =
      "cover";

    detailsLayout.style.backgroundPosition =
      "center";

  }else{

    detailsLayout.style.backgroundImage =
      "none";

  }


  document
    .getElementById("detailsModal")
    .classList.add("show");

}


/* =========================
   CLOSE DETAILS
========================= */

function closeDetails(){

  document
    .getElementById("detailsModal")
    .classList.remove("show");

  currentAnime = null;

}


/* =========================
   EDIT
========================= */

function editCurrentAnime(){

  if(!currentAnime){
    return;
  }


  const animeToEdit =
    currentAnime;


  closeDetails();

  openAnimeModal(animeToEdit);

}


/* =========================
   DELETE
========================= */

async function deleteCurrentAnime(){

  if(!currentAnime){
    return;
  }


  if(!confirm(
    "Delete " +
    currentAnime.title +
    "?"
  )){

    return;

  }


  const {
    data:{user}
  } =
  await supabaseClient.auth.getUser();


  if(!user){
    return;
  }


  const {
    error
  } =
  await supabaseClient
    .from("anime")
    .delete()
    .eq("id",currentAnime.id)
    .eq("user_id",user.id);


  if(error){

    alert(error.message);
    return;

  }


  closeDetails();

  await loadAnime();

}


/* =========================
   STATS
========================= */

function updateStats(){

  document
    .getElementById("watchingCount")
    .textContent =
    animeList.filter(
      a => a.status === "Watching"
    ).length;


  document
    .getElementById("completedCount")
    .textContent =
    animeList.filter(
      a => a.status === "Completed"
    ).length;


  document
    .getElementById("planCount")
    .textContent =
    animeList.filter(
      a => a.status === "Plan to Watch"
    ).length;


  document
    .getElementById("totalCount")
    .textContent =
    animeList.length;

}


/* =========================
   SECURITY
========================= */

function escapeHtml(value){

  return String(value)

    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================
   CLOSE PROFILE WHEN CLICKING OUTSIDE
========================= */

document.addEventListener(
  "click",
  function(event){

    const profile =
      document.querySelector(
        ".profile-wrap"
      );

    if(
      profile &&
      !profile.contains(event.target)
    ){

      document
        .getElementById("profileMenu")
        .classList.remove("show");

    }

  }
);


/* =========================
   AUTH STATE
========================= */

supabaseClient
  .auth
  .onAuthStateChange(
    (event,session)=>{

      updateUI(session);

      if(session){

        loadAnime();

      }else{

        animeList = [];

        renderAnime();

      }

    }
  );


/* START */

checkUser();

</script>

</html>
