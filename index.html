<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AniWatch List</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#09090f;
  color:#fff;
  min-height:100vh;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(9,9,15,.92);
  backdrop-filter:blur(14px);
  border-bottom:1px solid #242431;
}

.nav{
  max-width:1150px;
  margin:auto;
  padding:16px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  font-size:25px;
  font-weight:800;
  letter-spacing:.5px;
  animation:brandIn .8s ease;
}

.brand span{
  display:inline-block;
  animation:pulse 2.2s infinite;
}

@keyframes brandIn{
  from{
    opacity:0;
    transform:translateY(-15px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes pulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.08)}
}

.profile-wrap{
  position:relative;
}

.profile-btn{
  border:1px solid #343442;
  background:#191923;
  color:#fff;
  padding:9px 14px;
  border-radius:12px;
}

.profile-menu{
  display:none;
  position:absolute;
  right:0;
  top:48px;
  width:230px;
  background:#171720;
  border:1px solid #30303d;
  border-radius:14px;
  padding:14px;
  box-shadow:0 20px 50px rgba(0,0,0,.5);
}

.profile-menu.show{
  display:block;
  animation:menuIn .18s ease;
}

@keyframes menuIn{
  from{
    opacity:0;
    transform:translateY(-5px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.profile-email{
  font-size:13px;
  color:#aaa;
  word-break:break-all;
  margin-bottom:12px;
}

.logout{
  width:100%;
  border:0;
  background:#292936;
  color:#fff;
  padding:10px;
  border-radius:9px;
}

.container{
  max-width:1150px;
  margin:auto;
  padding:25px 20px 50px;
}

.hero{
  padding:25px 0;
}

.hero h1{
  font-size:34px;
  margin-bottom:7px;
}

.hero p{
  color:#9999a8;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-top:22px;
}

.stat{
  background:#15151f;
  border:1px solid #242431;
  border-radius:14px;
  padding:15px;
}

.stat-number{
  font-size:24px;
  font-weight:bold;
}

.stat-label{
  color:#8e8e9d;
  font-size:13px;
  margin-top:4px;
}

.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin:20px 0;
}

.toolbar-right{
  display:flex;
  gap:9px;
}

.search{
  width:230px;
  background:#15151f;
  color:#fff;
  border:1px solid #30303d;
  border-radius:10px;
  padding:11px 13px;
  outline:none;
}

.primary{
  border:0;
  background:#fff;
  color:#000;
  border-radius:10px;
  padding:11px 16px;
  font-weight:bold;
}

.secondary{
  border:1px solid #343442;
  background:#1b1b25;
  color:#fff;
  border-radius:10px;
  padding:10px 14px;
}

.anime-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:17px;
}

.card{
  background:#15151f;
  border:1px solid #242431;
  border-radius:14px;
  overflow:hidden;
  transition:.25s ease;
  animation:cardIn .45s ease both;
}

.card:hover{
  transform:translateY(-5px);
  border-color:#4a4a59;
}

@keyframes cardIn{
  from{
    opacity:0;
    transform:translateY(12px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.card-poster{
  height:270px;
  background:#242431;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#777;
}

.card-poster img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.card-info{
  padding:13px;
}

.card-title{
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.card-meta{
  display:flex;
  justify-content:space-between;
  gap:5px;
  margin-top:8px;
  color:#9999a8;
  font-size:12px;
}

.status{
  display:inline-block;
  margin-top:9px;
  background:#282834;
  border-radius:6px;
  padding:5px 8px;
  font-size:11px;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:55px 20px;
  background:#15151f;
  border:1px solid #242431;
  border-radius:15px;
  color:#8f8f9e;
}

/* MODALS */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:50;
  background:rgba(0,0,0,.78);
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:450px;
  max-height:90vh;
  overflow:auto;
  background:#171720;
  border:1px solid #30303d;
  border-radius:17px;
  padding:22px;
  animation:modalIn .2s ease;
}

@keyframes modalIn{
  from{
    opacity:0;
    transform:scale(.96);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

.modal-box h2{
  margin-bottom:16px;
}

input,
select,
textarea{
  width:100%;
  background:#0e0e15;
  color:#fff;
  border:1px solid #343442;
  border-radius:9px;
  padding:11px;
  margin-bottom:11px;
  outline:none;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.modal-actions{
  display:flex;
  gap:9px;
}

.modal-actions button{
  flex:1;
}

/* DETAILS */

.details-box{
  max-width:650px;
}

.details-layout{
  display:grid;
  grid-template-columns:190px 1fr;
  gap:20px;
}

.details-poster{
  height:280px;
  background:#242431;
  border-radius:12px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#777;
}

.details-poster img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.details-content h2{
  font-size:27px;
  margin-bottom:10px;
}

.detail-line{
  color:#aaa;
  margin:9px 0;
}

.notes{
  margin-top:15px;
  background:#101017;
  padding:12px;
  border-radius:10px;
  color:#aaa;
  line-height:1.5;
}

.details-actions{
  display:flex;
  gap:9px;
  margin-top:18px;
}

.details-actions button{
  flex:1;
}

/* LOGIN */

.auth-box{
  max-width:400px;
}

.auth-switch{
  text-align:center;
  margin-top:14px;
  color:#999;
  font-size:13px;
}

.link-btn{
  border:0;
  background:none;
  color:#fff;
  text-decoration:underline;
  cursor:pointer;
}

/* MOBILE */

@media(max-width:900px){
  .anime-grid{
    grid-template-columns:repeat(4,1fr);
  }
}

@media(max-width:700px){
  .anime-grid{
    grid-template-columns:repeat(3,1fr);
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .toolbar{
    flex-direction:column;
    align-items:stretch;
  }

  .toolbar-right{
    width:100%;
  }

  .search{
    width:100%;
  }
}

@media(max-width:500px){
  .anime-grid{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .card-poster{
    height:230px;
  }

  .details-layout{
    grid-template-columns:1fr;
  }

  .details-poster{
    height:330px;
  }

  .brand{
    font-size:21px;
  }
}
</style>
</head>

<body>

<header class="header">

<nav class="nav">

<div class="brand">
<span>🎬</span> AniWatch List
</div>

<div class="profile-wrap">

<button
class="profile-btn"
id="profileButton"
onclick="toggleProfile()">
👤 Profile
</button>

<div
class="profile-menu"
id="profileMenu">

<div
class="profile-email"
id="profileEmail">
Not logged in
</div>

<button
class="logout"
onclick="logout()">
🚪 Logout
</button>

</div>

</div>

</nav>

</header>


<main class="container">

<section class="hero">

<h1>My Anime Collection</h1>

<p>
Keep track of the anime you've watched.
</p>

<div class="stats">

<div class="stat">
<div
class="stat-number"
id="watchingCount">
0
</div>
<div class="stat-label">
Watching
</div>
</div>

<div class="stat">
<div
class="stat-number"
id="completedCount">
0
</div>
<div class="stat-label">
Completed
</div>
</div>

<div class="stat">
<div
class="stat-number"
id="planCount">
0
</div>
<div class="stat-label">
Plan to Watch
</div>
</div>

<div class="stat">
<div
class="stat-number"
id="totalCount">
0
</div>
<div class="stat-label">
Total Anime
</div>
</div>

</div>

</section>


<div class="toolbar">

<h2>Anime</h2>

<div class="toolbar-right">

<input
class="search"
id="search"
placeholder="Search anime..."
oninput="renderAnime()">

<button
class="primary"
onclick="openAnimeModal()">
＋ Add Anime
</button>

</div>

</div>


<div
class="anime-grid"
id="animeGrid">

<div class="empty">
Login to see your anime collection.
</div>

</div>

</main>


<!-- AUTH MODAL -->

<div
class="modal"
id="authModal">

<div class="modal-box auth-box">

<h2 id="authTitle">
Login
</h2>

<input
id="email"
type="email"
placeholder="Email">

<input
id="password"
type="password"
placeholder="Password">

<div class="modal-actions">

<button
class="primary"
id="authSubmit"
onclick="submitAuth()">
Login
</button>

<button
class="secondary"
id="authSwitch"
onclick="toggleAuth()">
Create Account
</button>

</div>

<div class="auth-switch">
<button
class="link-btn"
onclick="closeAuth()">
Cancel
</button>
</div>

</div>

</div>


<!-- ADD / EDIT MODAL -->

<div
class="modal"
id="animeModal">

<div class="modal-box">

<h2 id="animeModalTitle">
Add Anime
</h2>

<input
id="animeTitle"
placeholder="Anime title">

<select id="animeStatus">

<option value="Watching">
Watching
</option>

<option value="Completed">
Completed
</option>

<option value="Plan to Watch">
Plan to Watch
</option>

<option value="On Hold">
On Hold
</option>

<option value="Dropped">
Dropped
</option>

</select>

<input
id="animeEpisodes"
type="number"
placeholder="Episodes">

<input
id="animeRating"
type="number"
min="0"
max="10"
step="0.1"
placeholder="Rating / 10">

<input
id="animePoster"
placeholder="Poster image URL">

<textarea
id="animeNotes"
placeholder="Notes about this anime..."></textarea>

<div class="modal-actions">

<button
class="primary"
onclick="saveAnime()">
Save Anime
</button>

<button
class="secondary"
onclick="closeAnimeModal()">
Cancel
</button>

</div>

</div>

</div>


<!-- DETAILS MODAL -->

<div
class="modal"
id="detailsModal">

<div class="modal-box details-box">

<div
class="details-layout">

<div
class="details-poster"
id="detailsPoster">
No Poster
</div>

<div class="details-content">

<h2 id="detailsTitle">
Anime
</h2>

<div
class="detail-line"
id="detailsStatus">
Status:
</div>

<div
class="detail-line"
id="detailsEpisodes">
Episodes:
</div>

<div
class="detail-line"
id="detailsRating">
Rating:
</div>

<div
class="notes"
id="detailsNotes">
No notes.
</div>

</div>

</div>

<div class="details-actions">

<button
class="primary"
onclick="editCurrentAnime()">
✏️ Edit
</button>

<button
class="secondary"
onclick="deleteCurrentAnime()">
🗑️ Delete
</button>

<button
class="secondary"
onclick="closeDetails()">
Close
</button>

</div>

</div>

</div>


<script>

/* SUPABASE */

const SUPABASE_URL =
"https://iwggkwxirqydixsbbctb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_1McSJW8L9GflzowekoZM6A_mT53BuX7";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* VARIABLES */

let animeList = [];
let loginMode = true;
let editingId = null;
let currentAnime = null;


/* AUTH */

function openAuth(){

document
.getElementById("authModal")
.classList.add("show");

}

function closeAuth(){

document
.getElementById("authModal")
.classList.remove("show");

}


function toggleAuth(){

loginMode = !loginMode;

document
.getElementById("authTitle")
.textContent =
loginMode ? "Login" : "Create Account";

document
.getElementById("authSubmit")
.textContent =
loginMode ? "Login" : "Create Account";

document
.getElementById("authSwitch")
.textContent =
loginMode ? "Create Account" : "Back to Login";

}


async function submitAuth(){

const email =
document
.getElementById("email")
.value
.trim();

const password =
document
.getElementById("password")
.value;

if(!email || !password){

alert("Please enter your email and password.");

return;

}

if(password.length < 6){

alert("Password must be at least 6 characters.");

return;

}

let result;

if(loginMode){

result =
await supabaseClient.auth.signInWithPassword({
email,
password
});

}else{

result =
await supabaseClient.auth.signUp({
email,
password
});

}

if(result.error){

alert(result.error.message);

return;

}

if(!loginMode){

alert(
"Account created. Please confirm your email if required."
);

}else{

closeAuth();

}

}


/* PROFILE */

function toggleProfile(){

document
.getElementById("profileMenu")
.classList.toggle("show");

}


/* LOGOUT */

async function logout(){

await supabaseClient.auth.signOut();

document
.getElementById("profileMenu")
.classList.remove("show");

animeList = [];

updateUI(null);

renderAnime();

}


/* USER */

async function checkUser(){

const {
data:{session}
} =
await supabaseClient.auth.getSession();

updateUI(session);

if(session){

loadAnime();

}

}


function updateUI(session){

if(session){

document
.getElementById("profileEmail")
.textContent =
session.user.email;

}else{

document
.getElementById("profileEmail")
.textContent =
"Not logged in";

}

}


/* LOAD ANIME */

async function loadAnime(){

const {
data:{user}
} =
await supabaseClient.auth.getUser();

if(!user){

animeList=[];

renderAnime();

return;

}

const {
data,
error
} =
await supabaseClient
.from("anime")
.select("*")
.order("id",{ascending:false});

if(error){

alert(error.message);

return;

}

animeList = data || [];

renderAnime();

}


/* ADD / EDIT */

function openAnimeModal(anime=null){

editingId =
anime ? anime.id : null;

document
.getElementById("animeModalTitle")
.textContent =
anime ? "Edit Anime" : "Add Anime";

document
.getElementById("animeTitle")
.value =
anime?.title || "";

document
.getElementById("animeStatus")
.value =
anime?.status || "Watching";

document
.getElementById("animeEpisodes")
.value =
anime?.episodes ?? "";

document
.getElementById("animeRating")
.value =
anime?.rating ?? "";

document
.getElementById("animePoster")
.value =
anime?.poster || "";

document
.getElementById("animeNotes")
.value =
anime?.notes || "";

document
.getElementById("animeModal")
.classList.add("show");

}


function closeAnimeModal(){

document
.getElementById("animeModal")
.classList.remove("show");

editingId=null;

}


/* SAVE */

async function saveAnime(){

const {
data:{user}
} =
await supabaseClient.auth.getUser();

if(!user){

alert("Please login first.");

return;

}

const title =
document
.getElementById("animeTitle")
.value
.trim();

if(!title){

alert("Please enter an anime title.");

return;

}

const animeData = {

title:title,

status:
document
.getElementById("animeStatus")
.value,

episodes:
document
.getElementById("animeEpisodes")
.value === ""
? null
: Number(
document
.getElementById("animeEpisodes")
.value
),

rating:
document
.getElementById("animeRating")
.value === ""
? null
: Number(
document
.getElementById("animeRating")
.value
),

poster:
document
.getElementById("animePoster")
.value
.trim() || null,

notes:
document
.getElementById("animeNotes")
.value
.trim() || null

};

let result;

if(editingId){

result =
await supabaseClient
.from("anime")
.update(animeData)
.eq("id",editingId)
.eq("user_id",user.id);

}else{

result =
await supabaseClient
.from("anime")
.insert({
...animeData,
user_id:user.id
});

}

if(result.error){

alert(result.error.message);

return;

}

closeAnimeModal();

await loadAnime();

}


/* RENDER */

function renderAnime(){

const grid =
document.getElementById("animeGrid");

const search =
document
.getElementById("search")
.value
.toLowerCase();

const filtered =
animeList.filter(anime =>
(anime.title || "")
.toLowerCase()
.includes(search)
);

if(!filtered.length){

grid.innerHTML = `
<div class="empty">
No anime in your collection yet.
<br><br>
Tap <b>＋ Add Anime</b> to add one.
</div>
`;

updateStats();

return;

}

grid.innerHTML =
filtered
.map((anime,index)=>{

const poster =
anime.poster
? `<img src="${escapeHtml(anime.poster)}" alt="${escapeHtml(anime.title)}">`
: "🎬";

return `

<div
class="card"
style="animation-delay:${index * .04}s"
onclick="openDetails(${anime.id})">

<div class="card-poster">
${poster}
</div>

<div class="card-info">

<div class="card-title">
${escapeHtml(anime.title)}
</div>

<div class="card-meta">

<span>
⭐ ${anime.rating ?? "-"}
</span>

<span>
${anime.episodes ?? "-"} eps
</span>

</div>

<div class="status">
${escapeHtml(anime.status || "")}
</div>

</div>

</div>

`;

})
.join("");

updateStats();

}


/* DETAILS */

function openDetails(id){

currentAnime =
animeList.find(
anime => anime.id === id
);

if(!currentAnime)return;

document
.getElementById("detailsTitle")
.textContent =
currentAnime.title;

document
.getElementById("detailsStatus")
.textContent =
"Status: " +
(currentAnime.status || "-");

document
.getElementById("detailsEpisodes")
.textContent =
"Episodes: " +
(currentAnime.episodes ?? "-");

document
.getElementById("detailsRating")
.textContent =
"⭐ Rating: " +
(currentAnime.rating ?? "-");

document
.getElementById("detailsNotes")
.textContent =
currentAnime.notes ||
"No notes.";

const poster =
document.getElementById("detailsPoster");

if(currentAnime.poster){

poster.innerHTML =
`<img src="${escapeHtml(currentAnime.poster)}" alt="">`;

}else{

poster.textContent =
"No Poster";

}

document
.getElementById("detailsModal")
.classList.add("show");

}


function closeDetails(){

document
.getElementById("detailsModal")
.classList.remove("show");

currentAnime=null;

}


function editCurrentAnime(){

if(!currentAnime)return;

closeDetails();

openAnimeModal(currentAnime);

}


async function deleteCurrentAnime(){

if(!currentAnime)return;

if(!confirm(
"Delete " +
currentAnime.title +
"?"
))return;

const {
data:{user}
} =
await supabaseClient.auth.getUser();

if(!user)return;

const {
error
} =
await supabaseClient
.from("anime")
.delete()
.eq("id",currentAnime.id)
.eq("user_id",user.id);

if(error){

alert(error.message);

return;

}

closeDetails();

await loadAnime();

}


/* STATS */

function updateStats(){

document
.getElementById("watchingCount")
.textContent =
animeList.filter(
a => a.status === "Watching"
).length;

document
.getElementById("completedCount")
.textContent =
animeList.filter(
a => a.status === "Completed"
).length;

document
.getElementById("planCount")
.textContent =
animeList.filter(
a => a.status === "Plan to Watch"
).length;

document
.getElementById("totalCount")
.textContent =
animeList.length;

}


/* SECURITY / DISPLAY */

function escapeHtml(value){

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* AUTH STATE */

supabaseClient
.auth
.onAuthStateChange(
(event,session)=>{

updateUI(session);

if(session){

loadAnime();

}else{

animeList=[];

renderAnime();

}

}
);


/* START */

checkUser();

</script>

</body>
</html>
