<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Anime Notebook</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#0b0b12;color:#fff;min-height:100vh}
.container{max-width:1100px;margin:auto;padding:18px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}
.logo{font-size:24px;font-weight:bold}
button{border:0;border-radius:9px;padding:10px 15px;font-weight:bold;cursor:pointer}
.primary{background:#fff;color:#000}
.secondary{background:#292936;color:#fff}
.danger{background:#8d3030;color:#fff}

.hero{background:#151520;border-radius:18px;padding:24px;margin-bottom:20px}
.hero h1{margin-bottom:7px}
.muted{color:#9999a8}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}
.stat{background:#1d1d29;padding:15px;border-radius:12px}
.number{font-size:24px;font-weight:bold}
.label{color:#9999a8;font-size:13px;margin-top:4px}

.toolbar{display:flex;justify-content:space-between;align-items:center;margin:20px 0 15px;gap:10px}
.search{background:#151520;color:#fff;border:1px solid #30303c;padding:11px;border-radius:9px;width:220px}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.card{background:#151520;border-radius:15px;overflow:hidden}
.poster{height:220px;background:#242431;display:flex;justify-content:center;align-items:center;color:#777;overflow:hidden}
.poster img{width:100%;height:100%;object-fit:cover}
.info{padding:13px}
.info h3{margin-bottom:7px}
.info p{color:#aaa;font-size:13px;margin:5px 0}
.badge{display:inline-block;background:#282834;padding:5px 8px;border-radius:6px;font-size:11px;margin-top:5px}
.card-buttons{display:flex;gap:7px;margin-top:10px}
.card-buttons button{flex:1;font-size:12px;padding:8px}
.empty{background:#151520;padding:35px;text-align:center;border-radius:15px;color:#999;grid-column:1/-1}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);justify-content:center;align-items:center;padding:18px;z-index:10}
.modal-box{width:100%;max-width:430px;background:#151520;padding:22px;border-radius:17px}
.modal-box h2{margin-bottom:15px}

input,select,textarea{width:100%;background:#0d0d14;color:#fff;border:1px solid #333341;border-radius:8px;padding:11px;margin-bottom:10px;outline:none}
textarea{min-height:90px;resize:vertical}
.modal-buttons{display:flex;gap:8px}
.modal-buttons button{flex:1}

#userArea{display:none;align-items:center;gap:8px}
#loginArea{display:flex}
.message{text-align:center;padding:10px;color:#ff8b8b}

@media(max-width:800px){
.grid{grid-template-columns:repeat(2,1fr)}
.stats{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:500px){
.toolbar{align-items:stretch;flex-direction:column}
.search{width:100%}
.poster{height:190px}
.logo{font-size:19px}
}
</style>
</head>

<body>

<div class="container">

<header>
<div class="logo">🎬 My Anime Notebook</div>

<div id="loginArea">
<button class="primary" onclick="openAuth()">Login</button>
</div>

<div id="userArea">
<span id="userEmail"></span>
<button class="secondary" onclick="logout()">Logout</button>
</div>
</header>

<section class="hero">
<h1>My Anime List</h1>
<p class="muted">Your private anime notebook.</p>

<div class="stats">
<div class="stat">
<div class="number" id="watchingCount">0</div>
<div class="label">Watching</div>
</div>

<div class="stat">
<div class="number" id="completedCount">0</div>
<div class="label">Completed</div>
</div>

<div class="stat">
<div class="number" id="planCount">0</div>
<div class="label">Plan to Watch</div>
</div>

<div class="stat">
<div class="number" id="favoriteCount">0</div>
<div class="label">Favorites</div>
</div>
</div>
</section>

<div class="toolbar">
<h2>My Anime</h2>

<div>
<input class="search" id="search" placeholder="Search anime..." oninput="renderAnime()">
<button class="primary" onclick="openAnimeModal()">＋ Add Anime</button>
</div>
</div>

<div id="message" class="message"></div>
<div class="grid" id="animeGrid"></div>

</div>


<!-- LOGIN / CREATE ACCOUNT -->

<div class="modal" id="authModal">
<div class="modal-box">

<h2 id="authTitle">Login</h2>

<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<div class="modal-buttons">

<button
class="primary"
id="authSubmitButton"
onclick="submitAuth()">
Login
</button>

<button
class="secondary"
id="authToggleButton"
onclick="toggleAuth()">
Create account
</button>

</div>

<br>

<button
class="secondary"
style="width:100%"
onclick="closeAuth()">
Cancel
</button>

</div>
</div>


<!-- ADD ANIME -->

<div class="modal" id="animeModal">
<div class="modal-box">

<h2 id="animeModalTitle">Add Anime</h2>

<input id="animeTitle" placeholder="Anime name">

<select id="animeStatus">
<option value="Watching">Watching</option>
<option value="Completed">Completed</option>
<option value="Plan to Watch">Plan to Watch</option>
<option value="On Hold">On Hold</option>
<option value="Dropped">Dropped</option>
</select>

<input id="animeEpisodes" type="number" placeholder="Episodes">

<input id="animeRating" type="number" min="0" max="10" step="0.1" placeholder="Rating / 10">

<input id="animePoster" placeholder="Poster image URL">

<textarea id="animeNotes" placeholder="Your personal notes..."></textarea>

<div class="modal-buttons">
<button class="primary" onclick="saveAnime()">Save Anime</button>
<button class="secondary" onclick="closeAnimeModal()">Cancel</button>
</div>

</div>
</div>


<script>

const SUPABASE_URL =
"https://iwggkwxirqydixsbbctb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_1McSJW8L9GflzowekoZM6A_mT53BuX7";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let animeList=[];
let editingId=null;
let loginMode=true;


/* AUTH */

function openAuth(){
document.getElementById("authModal").style.display="flex";
}

function closeAuth(){
document.getElementById("authModal").style.display="none";
}

function toggleAuth(){

loginMode=!loginMode;

document.getElementById("authTitle").textContent =
loginMode ? "Login" : "Create Account";

document.getElementById("authSubmitButton").textContent =
loginMode ? "Login" : "Create Account";

document.getElementById("authToggleButton").textContent =
loginMode ? "Create account" : "Back to Login";
}


async function submitAuth(){

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;

if(!email || !password){
alert("Please enter email and password.");
return;
}

if(password.length < 6){
alert("Password must be at least 6 characters.");
return;
}

let result;

if(loginMode){

result=await supabaseClient.auth.signInWithPassword({
email:email,
password:password
});

}else{

result=await supabaseClient.auth.signUp({
email:email,
password:password
});

}

if(result.error){
alert(result.error.message);
return;
}

if(!loginMode){

alert("Account created successfully. Check your email if confirmation is required.");

}else{

closeAuth();

}

checkUser();
}


/* USER */

async function checkUser(){

const {
data:{session}
}=await supabaseClient.auth.getSession();

updateAuthUI(session);

if(session){
loadAnime();
}else{
showEmpty();
}
}


function updateAuthUI(session){

if(session){

document.getElementById("loginArea").style.display="none";
document.getElementById("userArea").style.display="flex";

document.getElementById("userEmail").textContent =
session.user.email || "Logged in";

}else{

document.getElementById("loginArea").style.display="flex";
document.getElementById("userArea").style.display="none";

}
}


async function logout(){

await supabaseClient.auth.signOut();

animeList=[];
updateAuthUI(null);
showEmpty();
}


/* LOAD ANIME */

async function loadAnime(){

const {
data:{user}
}=await supabaseClient.auth.getUser();

if(!user)return;

const {data,error} =
await supabaseClient
.from("anime")
.select("*")
.order("id",{ascending:false});

if(error){
alert(error.message);
return;
}

animeList=data || [];

renderAnime();
}


/* ADD / EDIT */

function openAnimeModal(anime=null){

editingId=anime ? anime.id : null;

document.getElementById("animeModalTitle").textContent =
anime ? "Edit Anime" : "Add Anime";

document.getElementById("animeTitle").value =
anime?.title || "";

document.getElementById("animeStatus").value =
anime?.status || "Watching";

document.getElementById("animeEpisodes").value =
anime?.episodes ?? "";

document.getElementById("animeRating").value =
anime?.rating ?? "";

document.getElementById("animePoster").value =
anime?.poster || "";

document.getElementById("animeNotes").value =
anime?.notes || "";

document.getElementById("animeModal").style.display="flex";
}


function closeAnimeModal(){

document.getElementById("animeModal").style.display="none";
editingId=null;

}


async function saveAnime(){

const title =
document.getElementById("animeTitle").value.trim();

if(!title){
alert("Please enter anime name.");
return;
}

const {
data:{user}
}=await supabaseClient.auth.getUser();

if(!user){
alert("Please login first.");
return;
}

const animeData={

title:title,

status:
document.getElementById("animeStatus").value,

episodes:
document.getElementById("animeEpisodes").value === ""
? null
: Number(document.getElementById("animeEpisodes").value),

rating:
document.getElementById("animeRating").value === ""
? null
: Number(document.getElementById("animeRating").value),

poster:
document.getElementById("animePoster").value.trim() || null,

notes:
document.getElementById("animeNotes").value.trim() || null

};

let result;

if(editingId){

result=await supabaseClient
.from("anime")
.update(animeData)
.eq("id",editingId);

}else{

result=await supabaseClient
.from("anime")
.insert({
...animeData,
user_id:user.id
});

}

if(result.error){
alert(result.error.message);
return;
}

closeAnimeModal();
loadAnime();
}


/* DELETE */

async function deleteAnime(id){

if(!confirm("Delete this anime?"))return;

const {error} =
await supabaseClient
.from("anime")
.delete()
.eq("id",id);

if(error){
alert(error.message);
return;
}

loadAnime();
}


function editAnime(id){

const anime =
animeList.find(a=>a.id===id);

if(anime){
openAnimeModal(anime);
}
}


/* DISPLAY */

function renderAnime(){

const grid=document.getElementById("animeGrid");

const search =
document.getElementById("search")
.value
.toLowerCase();

const filtered =
animeList.filter(anime =>
(anime.title || "")
.toLowerCase()
.includes(search)
);

if(!filtered.length){

showEmpty();
updateStats();
return;
}

grid.innerHTML=filtered.map(anime=>{

const poster=anime.poster
? `<img src="${escapeHtml(anime.poster)}" alt="">`
: "🎬 No Poster";

return `

<div class="card">

<div class="poster">
${poster}
</div>

<div class="info">

<h3>${escapeHtml(anime.title)}</h3>

<span class="badge">
${escapeHtml(anime.status || "")}
</span>

<p>Episodes: ${anime.episodes ?? "-"}</p>

<p>⭐ Rating: ${anime.rating ?? "-"}</p>

${anime.notes
? `<p>📝 ${escapeHtml(anime.notes)}</p>`
: ""}

<div class="card-buttons">

<button
class="secondary"
onclick="editAnime(${anime.id})">
Edit
</button>

<button
class="danger"
onclick="deleteAnime(${anime.id})">
Delete
</button>

</div>

</div>
</div>

`;

}).join("");

updateStats();
}


function updateStats(){

document.getElementById("watchingCount").textContent =
animeList.filter(a=>a.status==="Watching").length;

document.getElementById("completedCount").textContent =
animeList.filter(a=>a.status==="Completed").length;

document.getElementById("planCount").textContent =
animeList.filter(a=>a.status==="Plan to Watch").length;

document.getElementById("favoriteCount").textContent="0";
}


function showEmpty(){

document.getElementById("animeGrid").innerHTML=`

<div class="empty">

No anime found.

<br><br>

Login and add your first anime.

</div>

`;

}


function escapeHtml(value){

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* AUTH STATE */

supabaseClient.auth.onAuthStateChange(
(event,session)=>{

updateAuthUI(session);

if(session){
loadAnime();
}else{
animeList=[];
showEmpty();
}

}
);

checkUser();

</script>

</body>
</html>
